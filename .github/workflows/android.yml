name: Android CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ensure java 17 is used
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
      - name: Run CI
        run: make ci
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hms-plugin.zip
          path: release/
          override: true
