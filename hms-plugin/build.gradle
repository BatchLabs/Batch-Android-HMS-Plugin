apply plugin: 'com.android.library'

ext {
    mavenGroupId = 'com.batch.android'
    mavenArtifact = 'hms-plugin'
    androidXLibraryVersion = '1.0.0'
}

android {
    namespace = "com.batch.android.plugin.hms"
    defaultConfig {
        minSdkVersion 17
        compileSdk 34
        targetSdkVersion 34
        versionCode 1
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        manifestPlaceholders += [ versionName: defaultConfig.versionName ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events "started", "passed", "skipped", "failed"
                }
            }
        }
    }
}

dependencies {
    api 'com.batch.android:batch-sdk:2.0+'
    api 'com.huawei.hms:push:6.5.0.300'
    implementation "androidx.annotation:annotation:$androidXLibraryVersion"

    // Optional
    compileOnly 'com.huawei.hms:ads-identifier:3.4.30.307'

    compileOnly "com.google.firebase:firebase-messaging:22.0.0"

    testImplementation 'junit:junit:4.13'
    testImplementation 'androidx.test.ext:junit:1.1.1'
    testImplementation 'org.mockito:mockito-core:3.2.4'
    testImplementation 'org.robolectric:robolectric:4.4'
    testImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

apply from: 'maven-publish.gradle'
apply from: 'jacoco.gradle'
apply from: 'sonar.gradle'
