apply plugin: 'com.android.library'

ext {
    mavenGroupId = 'com.batch.android'
    mavenArtifact = 'hms-plugin'
    androidXLibraryVersion = '1.0.0'
}

android {
    namespace = "com.batch.android.plugin.hms"
    defaultConfig {
        minSdkVersion 21
        compileSdk 34
        targetSdkVersion 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        manifestPlaceholders += [ versionName: defaultConfig.versionName ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events "started", "passed", "skipped", "failed"
                }
            }
        }
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

dependencies {
    api 'com.batch.android:batch-sdk:2.0+'
    api 'com.huawei.hms:push:6.5.0.300'
    implementation "androidx.annotation:annotation:$androidXLibraryVersion"

    // Optional
    compileOnly "com.google.firebase:firebase-messaging:22.0.0"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

apply from: 'maven-publish.gradle'
apply from: 'jacoco.gradle'
